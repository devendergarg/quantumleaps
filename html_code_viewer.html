<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>HTML Code Viewer</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#f3f4f6;color:#111827}body{display:flex;flex-direction:column;overflow:hidden}.topbar{padding:9px 10px;background:#fff;border-bottom:1px solid #d1d5db;display:flex;gap:7px;align-items:center;flex-wrap:wrap}.title{font-weight:700;font-size:18px;margin-right:auto}button,select{height:37px;border:1px solid #cbd5e1;border-radius:8px;background:#fff;padding:0 11px;font-size:14px;color:#111827}button{cursor:pointer}.primary{background:#111827;color:#fff;border-color:#111827}.main{flex:1;min-height:0;display:flex;flex-direction:column;padding:9px;gap:9px}.panel{min-height:0;display:flex;flex-direction:column;background:#fff;border:1px solid #d1d5db;border-radius:11px;overflow:hidden;flex:1}.panelhead{height:41px;flex:none;display:flex;align-items:center;padding:0 9px;border-bottom:1px solid #e5e7eb;font-size:14px;font-weight:650}.actions{margin-left:auto;display:flex;gap:5px}.actions button{height:29px;padding:0 8px;font-size:12px}.status{font-size:11px;color:#64748b;margin-left:7px}.editorCodeWrap{flex:1;min-height:0;display:flex;overflow:hidden;background:#fbfbfc}.lineNumbers{flex:none;width:42px;overflow:hidden;padding:14px 7px 14px 0;text-align:right;border-right:1px solid #e5e7eb;background:#f1f3f5;color:#94a3b8;font:13px/1.55 ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;user-select:none;white-space:pre}.lineNumbers span{display:block;height:1.55em}.editorCodeWrap #code{flex:1;width:0;resize:none;border:0;outline:0;padding:14px;font:13px/1.55 ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;background:#fbfbfc;color:#111827;tab-size:2}.previewWrap{position:relative;flex:1;background:#e5e7eb;min-height:180px}#preview{width:100%;height:100%;border:0;background:#fff;display:block}.consoleWrap{height:150px;flex:none;border-top:1px solid #d1d5db;background:#0f172a;display:flex;flex-direction:column}.consoleHead{height:34px;flex:none;display:flex;align-items:center;padding:0 9px;color:#e5e7eb;font-size:12px;font-weight:650;border-bottom:1px solid #334155}.consoleHead button{height:25px;padding:0 8px;font-size:11px;margin-left:auto;background:#1e293b;color:#e5e7eb;border-color:#475569}.consoleBody{flex:1;min-height:0;overflow:auto;padding:7px 9px;font:12px/1.45 ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace}.consoleLine{white-space:pre-wrap;word-break:break-word;padding:2px 0}.consoleLine.log{color:#e2e8f0}.consoleLine.warn{color:#facc15}.consoleLine.error{color:#f87171}.consoleLine.info{color:#93c5fd}.consoleEmpty{color:#64748b}@media(orientation:landscape) and (max-height:600px){.main{flex-direction:row}}@media(max-width:600px){.topbar{padding:7px}.title{width:100%;font-size:17px}.topbar button,.topbar select{flex:1;min-width:0}.main{padding:7px}.lineNumbers{width:38px;padding-right:6px;font-size:12px}.editorCodeWrap #code{font-size:12px}.panelhead{padding:0 8px}.actions button{padding:0 7px}.consoleWrap{height:125px}}
</style></head><body>
<div class="topbar"><div class="title">HTML Code Viewer</div><select id="viewMode"><option value="split">Split View</option><option value="editor">Editor Only</option><option value="preview">Preview Only</option></select><button class="primary" id="runBtn">▶ Run</button><button id="clearBtn">Clear</button><button id="saveBtn">Save HTML</button></div>
<div class="main" id="main"><section class="panel" id="editorPanel"><div class="panelhead">HTML<span class="status" id="status">Ready</span><div class="actions"><button id="undoBtn">Undo</button><button id="redoBtn">Redo</button><button id="copyBtn">Copy</button></div></div><div class="editorCodeWrap"><div class="lineNumbers" id="lineNumbers" aria-hidden="true"></div><textarea id="code" spellcheck="false"><!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>My Page</title><style>body{font-family:Arial,sans-serif;text-align:center;padding:40px;background:#f4f4f4}h1{color:#2563eb}button{padding:10px 18px;border:0;border-radius:8px;background:#2563eb;color:white;cursor:pointer}</style></head><body><h1>Hello from HTML Viewer</h1><p>Edit the HTML and press Run.</p><button onclick="alert('It works!')">Test Button</button></body></html></textarea></div></section>
<section class="panel" id="previewPanel"><div class="panelhead">Preview<span class="status">Sandboxed</span><div class="actions"><button id="refreshBtn">Refresh</button><button id="fullscreenBtn">Fullscreen</button></div></div><div class="previewWrap"><iframe id="preview" sandbox="allow-scripts allow-forms allow-modals allow-popups"></iframe></div><div class="consoleWrap"><div class="consoleHead">Console<button id="clearConsoleBtn">Clear</button></div><div class="consoleBody" id="consoleBody"><div class="consoleEmpty">Console output will appear here.</div></div></div></section></div>
<script>
const code=document.getElementById('code'),lineNumbers=document.getElementById('lineNumbers'),preview=document.getElementById('preview'),main=document.getElementById('main'),editorPanel=document.getElementById('editorPanel'),previewPanel=document.getElementById('previewPanel'),status=document.getElementById('status'),viewMode=document.getElementById('viewMode'),consoleBody=document.getElementById('consoleBody');let history=[],historyIndex=-1,restoring=false,timer;
function setStatus(x){status.textContent=x}function updateLineNumbers(){const n=Math.max(1,code.value.split('\n').length);lineNumbers.innerHTML=Array.from({length:n},(_,i)=>'<span>'+(i+1)+'</span>').join('')}function addConsole(type,text){if(consoleBody.querySelector('.consoleEmpty'))consoleBody.innerHTML='';const line=document.createElement('div');line.className='consoleLine '+type;line.textContent=text;consoleBody.appendChild(line);consoleBody.scrollTop=consoleBody.scrollHeight}function clearConsole(){consoleBody.innerHTML='<div class="consoleEmpty">Console output will appear here.</div>'}function buildSrcdoc(src){const bridge=`<script>(function(){function serialize(v){try{if(typeof v==='string')return v;if(v instanceof Error)return v.stack||v.message;return JSON.stringify(v,(k,val)=>typeof val==='bigint'?val.toString()+'n':val)}catch(e){return String(v)}}function send(type,args){parent.postMessage({source:'html-viewer-console',type:type,args:Array.from(args).map(serialize)},'*')}['log','warn','error'].forEach(type=>{const old=console[type];console[type]=function(){send(type,arguments);old.apply(console,arguments)}});window.addEventListener('error',e=>send('error',[e.error||e.message+' at '+e.filename+':'+e.lineno+':'+e.colno]));window.addEventListener('unhandledrejection',e=>send('error',[e.reason instanceof Error?e.reason:(e.reason??'Unhandled promise rejection')]));})();<\/script>`;const m=src.match(/<head[^>]*>/i);if(m)return src.slice(0,m.index+m[0].length)+bridge+src.slice(m.index+m[0].length);const b=src.match(/<body[^>]*>/i);if(b)return src.slice(0,b.index)+bridge+src.slice(b.index);return bridge+src}function pushHistory(v){if(restoring||history[historyIndex]===v)return;history=history.slice(0,historyIndex+1);history.push(v);if(history.length>100)history.shift();historyIndex=history.length-1}function saveLocal(){localStorage.setItem('html-viewer-code',code.value)}function run(){clearTimeout(timer);timer=setTimeout(()=>{clearConsole();preview.srcdoc=buildSrcdoc(code.value);saveLocal();setStatus('Rendered')},60)}function setMode(m){editorPanel.style.display=m==='preview'?'none':'flex';previewPanel.style.display=m==='editor'?'none':'flex';if(m==='split')main.style.flexDirection=innerWidth>innerHeight?'row':'column';else main.style.flexDirection='column'}
code.addEventListener('scroll',()=>{lineNumbers.scrollTop=code.scrollTop});code.addEventListener('input',updateLineNumbers);const saved=localStorage.getItem('html-viewer-code');if(saved!==null)code.value=saved;updateLineNumbers();pushHistory(code.value);setMode('split');run();
window.addEventListener('message',e=>{const d=e.data;if(!d||d.source!=='html-viewer-console')return;addConsole(d.type,Array.isArray(d.args)?d.args.join(' '):String(d.args??''))});document.getElementById('clearConsoleBtn').onclick=clearConsole;code.addEventListener('input',()=>{pushHistory(code.value);saveLocal();setStatus('Edited')});document.getElementById('runBtn').onclick=run;document.getElementById('refreshBtn').onclick=run;document.getElementById('clearBtn').onclick=()=>{code.value='';pushHistory('');run()};
document.getElementById('copyBtn').onclick=async()=>{try{await navigator.clipboard.writeText(code.value)}catch(e){code.focus();code.select();document.execCommand('copy');window.getSelection()?.removeAllRanges()}setStatus('Copied')};document.getElementById('undoBtn').onclick=()=>{if(historyIndex<=0)return;historyIndex--;restoring=true;code.value=history[historyIndex];restoring=false;saveLocal();setStatus('Undo')};document.getElementById('redoBtn').onclick=()=>{if(historyIndex>=history.length-1)return;historyIndex++;restoring=true;code.value=history[historyIndex];restoring=false;saveLocal();setStatus('Redo')};
document.getElementById('saveBtn').onclick=()=>{const b=new Blob([code.value],{type:'text/html;charset=utf-8'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='index.html';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1000);setStatus('Saved')};document.getElementById('fullscreenBtn').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await previewPanel.requestFullscreen()}catch(e){}};viewMode.onchange=()=>setMode(viewMode.value);addEventListener('resize',()=>{if(viewMode.value==='split')setMode('split')});code.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'){e.preventDefault();document.getElementById('saveBtn').click()}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='enter'){e.preventDefault();run()}});
</script></body></html>
